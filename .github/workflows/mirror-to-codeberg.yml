# Mirror main branch to Codeberg mirror repository.
name: Mirror to Codeberg

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        env:
          CODEBERG_DEPLOY_KEY: ${{ secrets.CodeBerg_Deploy_Key }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts 2>/dev/null
          eval $(ssh-agent -s)
          echo "$CODEBERG_DEPLOY_KEY" | ssh-add -
          git remote add codeberg git@codeberg.org:Gnidreve/classic-imap-smtp-mcp.git
          git push --mirror codeberg
