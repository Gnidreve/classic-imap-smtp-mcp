# Nightly + main: Integration-Tests gegen Dovecot+Mailpit via docker-compose.test.yml.
name: Integration
on:
  schedule: [{ cron: "0 3 * * *" }]
  push: { branches: [main] }
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (non-blocking advisory)
        run: pnpm audit --audit-level=high || echo "::warning::pnpm audit found high/critical vulnerabilities"
      - run: docker compose -f docker-compose.test.yml up -d
      - run: pnpm test:integration
      - run: docker compose -f docker-compose.test.yml down
